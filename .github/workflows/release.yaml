name: Build wheel and upload to PyPI on release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/release.yaml
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: build · wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for version detection from Git tags
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Smoke-test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python - <<'PY'
          import lakefs_spec
          print("lakefs-spec", lakefs_spec.__version__)
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  publish:
    name: publish · pypi
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Assert every artifact matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for f in dist/*; do
            case "${f##*/}" in
              lakefs_spec-"${TAG#v}"-*.whl | lakefs_spec-"${TAG#v}".tar.gz) ;;
              *) echo "::error::${f##*/} is not version ${TAG#v}"; exit 1 ;;
            esac
          done

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  docs:
    name: docs · publish release version
    needs: [publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes to the gh-pages branch
    services:
      lakefs: # required for building documentation
        image: treeverse/lakefs:latest
        ports:
          - 8000:8000
        env:
          LAKEFS_INSTALLATION_USER_NAME: "quickstart"
          LAKEFS_INSTALLATION_ACCESS_KEY_ID: "AKIAIOSFOLQUICKSTART"
          LAKEFS_INSTALLATION_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          LAKEFS_DATABASE_TYPE: "local"
          LAKEFS_AUTH_ENCRYPT_SECRET_KEY: "THIS_MUST_BE_CHANGED_IN_PRODUCTION"
          LAKEFS_BLOCKSTORE_TYPE: "local"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for documentation builds
          persist-credentials: true

      - name: Set up Python and dependencies
        uses: ./.github/actions/python-deps
        with:
          pythonVersion: 3.11

      - name: Publish documentation
        uses: ./.github/actions/mike-docs
        with:
          version: ${{ github.event.release.tag_name }}
          alias: latest
          push: true
