[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lakefs-spec"
description = "An fsspec implementation for lakeFS."
keywords = ["lakeFS", "fsspec"]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "appliedAI Institute for Europe", email = "lakefs-spec@appliedai-institute.de" },
]
maintainers = [
    { name = "Nicholas Junge", email = "n.junge@appliedai-institute.de" },
    { name = "Max Mynter", email = "m.mynter@appliedai-institute.de" },
    { name = "Adrian Rumpold", email = "a.rumpold@appliedai-institute.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "fsspec>=2024.12.0",
    "lakefs>=0.7.0",
    "typing_extensions",
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/aai-institute/lakefs-spec"
Repository = "https://github.com/aai-institute/lakefs-spec.git"
Issues = "https://github.com/aai-institute/lakefs-spec/issues"
Discussions = "https://github.com/aai-institute/lakefs-spec/discussions"
Documentation = "https://lakefs-spec.org/latest"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # for integration tests.
    "pandas[parquet]",
    "polars",
    "duckdb",
    "ty>=0.0.79",
    "ruff>=0.16.6",
]
docs = [
    "mkdocs",
    "mkdocs-callouts",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-git-revision-date-localized-plugin",
    "neoteroi-mkdocs",
    "mknotebooks",
    "ipykernel",                                 # kernel for executing the tutorial notebook
    "jupytext",                                  # conversion between Jupytext and ipynb notebooks
    "ruff",                                      # formatting of signatures in docs
    "mike",
    "scikit-learn",                              # for the data science demo.
    "pandas",
]

# Automatically determine version number from Git tags
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/lakefs_spec"]

[tool.hatch.build.targets.sdist]
# pyproject.toml, README.md and LICENSE are always included.
only-include = ["src", "tests", "assets"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"

[tool.uv]
default-groups = ["dev", "docs"]
exclude-newer = "1 week"
exclude-newer-package = { ruff = false, ty = false }

[tool.ruff]
exclude = ["*.md"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["C408"]

[[tool.ty.overrides]]
# The HF datasets example is not runnable in the dev environment, ignore the missing import.
include = ["docs/_code/hf_datasets_example.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.coverage.report]
exclude_also = ["@overload", "raise NotImplementedError"]
